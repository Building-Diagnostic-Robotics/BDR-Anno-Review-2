[package]
name = "bdr-anno-review-app"
version.workspace = true
edition.workspace = true
license.workspace = true

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
serde.workspace = true
serde_json.workspace = true
engine = { path = "../crates/engine" }
providers = { path = "../crates/providers" }
reqwest = { version = "0.12", default-features = false, features = ["json", "blocking", "native-tls"] }
keyring = { version = "3", features = ["windows-native", "apple-native", "linux-native-sync-persistent"] }
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
tokio-util = "0.7"
rusqlite = { version = "0.32", features = ["bundled"] }
sha2 = "0.10"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
