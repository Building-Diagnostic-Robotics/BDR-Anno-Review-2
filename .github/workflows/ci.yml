name: CI

on:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux system dependencies for Tauri
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libglib2.0-dev \
            libgdk-pixbuf-2.0-dev \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Force public npm registry resolution
        run: |
          pnpm config set registry https://registry.npmjs.org/
          pnpm config set @tauri-apps:registry https://registry.npmjs.org/
          pnpm config set always-auth false
      - name: Install frontend dependencies
        run: pnpm --dir frontend install --frozen-lockfile=false
      - name: Build frontend assets for Tauri context validation
        run: pnpm --dir frontend build
      - name: Rust checks
        run: |
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets -- -D warnings
          cargo test --workspace
      - name: Frontend typecheck
        run: pnpm --dir frontend lint
      - name: Frontend tests
        run: pnpm --dir frontend test
