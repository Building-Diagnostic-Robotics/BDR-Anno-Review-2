name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux system dependencies for Tauri
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libglib2.0-dev \
            libgdk-pixbuf-2.0-dev \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Force public npm registry resolution
        run: |
          pnpm config set registry https://registry.npmjs.org/
          pnpm config set @tauri-apps:registry https://registry.npmjs.org/
          pnpm config set always-auth false
      - name: Install frontend dependencies
        run: pnpm --dir frontend install --frozen-lockfile=false
      - name: Build frontend assets
        run: pnpm --dir frontend build

      - name: Validate in-repo versions match release tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: ./scripts/check-tag-version.sh "${{ github.ref_name }}"

      - name: Rust checks
        run: |
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets -- -D warnings
          cargo test --workspace
      - name: Frontend lint
        run: pnpm --dir frontend lint
      - name: Frontend tests
        run: pnpm --dir frontend test

  build-and-upload:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: checks
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            bundle_filter: --bundles appimage,deb
            rust_target: x86_64-unknown-linux-gnu
          - platform: windows-latest
            bundle_filter: --bundles nsis
            rust_target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install Linux system dependencies for Tauri
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libglib2.0-dev \
            libgdk-pixbuf-2.0-dev \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev
      - name: Force public npm registry resolution
        run: |
          pnpm config set registry https://registry.npmjs.org/
          pnpm config set @tauri-apps:registry https://registry.npmjs.org/
          pnpm config set always-auth false
      - name: Install frontend dependencies
        run: pnpm --dir frontend install --frozen-lockfile=false
      - name: Build frontend assets
        run: pnpm --dir frontend build

      - name: Prepare FFmpeg sidecar binaries (Linux)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          set -euo pipefail
          mkdir -p src-tauri/binaries
          curl -fsSL https://johnvansickle.com/ffmpeg/releases/ffmpeg-release-amd64-static.tar.xz -o /tmp/ffmpeg.tar.xz
          tar -xf /tmp/ffmpeg.tar.xz -C /tmp
          ffmpeg_root="$(find /tmp -maxdepth 1 -type d -name 'ffmpeg-*-amd64-static' | head -n 1)"
          if [ -z "$ffmpeg_root" ]; then
            echo "error: could not locate extracted ffmpeg static directory" >&2
            exit 1
          fi
          cp "$ffmpeg_root/ffmpeg" "src-tauri/binaries/ffmpeg-${{ matrix.rust_target }}"
          cp "$ffmpeg_root/ffprobe" "src-tauri/binaries/ffprobe-${{ matrix.rust_target }}"
          chmod +x "src-tauri/binaries/ffmpeg-${{ matrix.rust_target }}" "src-tauri/binaries/ffprobe-${{ matrix.rust_target }}"

      - name: Prepare FFmpeg sidecar binaries (Windows)
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path src-tauri/binaries | Out-Null
          $archivePath = Join-Path $env:RUNNER_TEMP 'ffmpeg.7z'
          Invoke-WebRequest -Uri 'https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.7z' -OutFile $archivePath
          7z x $archivePath -o"$env:RUNNER_TEMP/ffmpeg" -y | Out-Null
          $binDir = Get-ChildItem "$env:RUNNER_TEMP/ffmpeg" -Directory | Select-Object -First 1 | ForEach-Object { Join-Path $_.FullName 'bin' }
          if (-not (Test-Path $binDir)) {
            throw 'Could not locate extracted ffmpeg bin directory.'
          }
          Copy-Item (Join-Path $binDir 'ffmpeg.exe') "src-tauri/binaries/ffmpeg-${{ matrix.rust_target }}.exe"
          Copy-Item (Join-Path $binDir 'ffprobe.exe') "src-tauri/binaries/ffprobe-${{ matrix.rust_target }}.exe"

      - name: Verify prepared sidecar binaries (Linux)
        if: matrix.platform == 'ubuntu-22.04'
        run: ls -la src-tauri/binaries
      - name: Verify prepared sidecar binaries (Windows)
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: Get-ChildItem src-tauri/binaries | Format-Table -AutoSize
      - name: Verify expected sidecar filenames exist
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ matrix.platform }}" = "windows-latest" ]; then
            test -f "src-tauri/binaries/ffmpeg-${{ matrix.rust_target }}.exe"
            test -f "src-tauri/binaries/ffprobe-${{ matrix.rust_target }}.exe"
          else
            test -f "src-tauri/binaries/ffmpeg-${{ matrix.rust_target }}"
            test -f "src-tauri/binaries/ffprobe-${{ matrix.rust_target }}"
          fi
      - name: Build and upload Tauri bundles
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Release ${{ github.ref_name }}
          releaseBody: Automated release build for external tester validation.
          releaseDraft: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          args: ${{ matrix.bundle_filter }} --config src-tauri/tauri.release.conf.json

      - name: Verify Windows NSIS bundle contains FFmpeg sidecars
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          $candidateRoots = @()
          if ($env:CARGO_TARGET_DIR) {
            $candidateRoots += $env:CARGO_TARGET_DIR
          }
          $candidateRoots += @(
            (Join-Path $env:GITHUB_WORKSPACE 'target'),
            (Join-Path $env:GITHUB_WORKSPACE 'src-tauri/target')
          )

          $candidateRoots = $candidateRoots |
            Where-Object { $_ -and $_.Trim().Length -gt 0 } |
            ForEach-Object { [System.IO.Path]::GetFullPath($_) } |
            Select-Object -Unique

          $existingRoots = $candidateRoots | Where-Object { Test-Path $_ }

          if (-not $existingRoots) {
            throw "Expected Tauri target directory does not exist. Searched: $($candidateRoots -join ', ')"
          }

          $nsisCandidates = @()
          foreach ($root in $existingRoots) {
            $nsisCandidates += Get-ChildItem -Path $root -Recurse -File -Filter '*-setup.exe' -ErrorAction SilentlyContinue |
              Where-Object { $_.FullName -match '[\\/]bundle[\\/]nsis[\\/]' }
          }

          $nsisCandidates = $nsisCandidates | Sort-Object -Property FullName -Unique

          Write-Host 'NSIS setup discovery diagnostics:'
          Write-Host "- Searched roots: $($candidateRoots -join ', ')"
          Write-Host "- Existing roots: $($existingRoots -join ', ')"
          if ($nsisCandidates) {
            $nsisCandidates | ForEach-Object { Write-Host "- $($_.FullName)" }
          } else {
            Write-Host '- No NSIS setup candidates found.'
          }

          if ($nsisCandidates.Count -eq 0) {
            throw "Could not locate generated NSIS setup executable under existing roots '$($existingRoots -join ', ')' (searched recursively for '*-setup.exe' in bundle/nsis paths)."
          }
          if ($nsisCandidates.Count -gt 1) {
            throw "Expected exactly one NSIS setup executable but found $($nsisCandidates.Count)."
          }
          $setup = $nsisCandidates | Select-Object -First 1

          $extractDir = Join-Path $env:RUNNER_TEMP 'nsis-inspect'
          if (Test-Path $extractDir) {
            Remove-Item -Recurse -Force $extractDir
          }
          New-Item -ItemType Directory -Force -Path $extractDir | Out-Null

          7z x $setup.FullName "-o$extractDir" -y | Out-Null

          # Tauri sidecars can appear as target-suffixed names or normalized executable names in installer payloads.
          $ffmpegAllowedNames = @('ffmpeg-x86_64-pc-windows-msvc.exe', 'ffmpeg.exe')
          $ffprobeAllowedNames = @('ffprobe-x86_64-pc-windows-msvc.exe', 'ffprobe.exe')
          $allowedNameSet = @($ffmpegAllowedNames + $ffprobeAllowedNames)
          $allowedPattern = '(?i)(ffmpeg(?:-x86_64-pc-windows-msvc)?\.exe|ffprobe(?:-x86_64-pc-windows-msvc)?\.exe)'

          $directSidecars = Get-ChildItem -Path $extractDir -Recurse -File -ErrorAction SilentlyContinue |
            Where-Object { $allowedNameSet -contains $_.Name }

          $ffmpegOnDisk = $directSidecars | Where-Object { $ffmpegAllowedNames -contains $_.Name } | Select-Object -First 1
          $ffprobeOnDisk = $directSidecars | Where-Object { $ffprobeAllowedNames -contains $_.Name } | Select-Object -First 1
          if ($ffmpegOnDisk -and $ffprobeOnDisk) {
            Write-Host "Found sidecars directly in extracted NSIS payload:"
            Write-Host "- $($ffmpegOnDisk.FullName)"
            Write-Host "- $($ffprobeOnDisk.FullName)"
            exit 0
          }

          Write-Host "NSIS sidecar direct-file check did not find both tools. Setup: $($setup.FullName)"
          Write-Host "Allowed FFmpeg names: $($ffmpegAllowedNames -join ', ')"
          Write-Host "Allowed FFprobe names: $($ffprobeAllowedNames -join ', ')"
          if ($directSidecars) {
            Write-Host 'Observed sidecar-like files in extracted payload:'
            $directSidecars | ForEach-Object { Write-Host "- $($_.FullName)" }
          } else {
            Write-Host 'Observed sidecar-like files in extracted payload: none'
          }

          $embeddedListings = @()
          $embeddedListingCandidates = Get-ChildItem -Path $extractDir -Recurse -File -ErrorAction SilentlyContinue |
            Where-Object {
              $_.Extension -in @('.exe', '.7z', '.zip') -or
              [string]::IsNullOrWhiteSpace($_.Extension)
            }

          if (-not $embeddedListingCandidates) {
            Write-Host 'No embedded listing candidates were found in extracted NSIS payload.'
          } else {
            Write-Host 'Embedded listing candidate files:'
            $embeddedListingCandidates | ForEach-Object { Write-Host "- $($_.FullName)" }
          }

          foreach ($candidate in $embeddedListingCandidates) {
            $targetExe = $candidate.FullName
            $listingPath = "$targetExe.listing.txt"
            $listingOutput = & 7z l $targetExe 2>&1
            if ($LASTEXITCODE -ne 0) {
              Write-Host "Skipping unreadable embedded listing candidate: $targetExe"
              continue
            }

            $listingOutput | Out-File $listingPath
            $embeddedListings += (Get-Content $listingPath -Raw)
          }

          $mergedListings = ($embeddedListings -join "`n")
          $sidecarHits = @()
          if ($mergedListings) {
            $sidecarHits = [regex]::Matches($mergedListings, '(?im)^.*(?:ffmpeg|ffprobe).*$') |
              ForEach-Object { $_.Value.Trim() } |
              Select-Object -Unique
          }

          if ($sidecarHits) {
            Write-Host 'Embedded listing sidecar-like entries:'
            $sidecarHits | ForEach-Object { Write-Host "- $_" }
          } else {
            Write-Host 'Embedded listing sidecar-like entries: none'
          }

          if ($mergedListings -notmatch '(?i)(ffmpeg(?:-x86_64-pc-windows-msvc)?\.exe)') {
            throw "ffmpeg sidecar is missing from NSIS payload (accepted names: $($ffmpegAllowedNames -join ', '); direct files and embedded payloads checked)."
          }
          if ($mergedListings -notmatch '(?i)(ffprobe(?:-x86_64-pc-windows-msvc)?\.exe)') {
            throw "ffprobe sidecar is missing from NSIS payload (accepted names: $($ffprobeAllowedNames -join ', '); direct files and embedded payloads checked)."
          }

      - name: Verify Linux bundles contain FFmpeg sidecars
        if: matrix.platform == 'ubuntu-22.04'
        shell: bash
        run: |
          set -euo pipefail

          ffmpeg_allowed_names=("ffmpeg" "ffmpeg-x86_64-unknown-linux-gnu")
          ffprobe_allowed_names=("ffprobe" "ffprobe-x86_64-unknown-linux-gnu")

          candidate_roots=()
          if [ -n "${CARGO_TARGET_DIR:-}" ]; then
            candidate_roots+=("$CARGO_TARGET_DIR")
          fi
          candidate_roots+=("$GITHUB_WORKSPACE/target" "$GITHUB_WORKSPACE/src-tauri/target")

          existing_roots=()
          for root in "${candidate_roots[@]}"; do
            [ -n "$root" ] || continue
            if [ -d "$root" ]; then
              existing_roots+=("$(cd "$root" && pwd)")
            fi
          done

          if [ "${#existing_roots[@]}" -eq 0 ]; then
            echo "Expected Tauri target directory does not exist. Searched: ${candidate_roots[*]}" >&2
            exit 1
          fi

          echo "Linux bundle discovery diagnostics:"
          echo "- Searched roots: ${candidate_roots[*]}"
          echo "- Existing roots: ${existing_roots[*]}"

          find_bundle_artifact() {
            local regex="$1"
            local label="$2"
            local found=()
            for root in "${existing_roots[@]}"; do
              while IFS= read -r path; do
                found+=("$path")
              done < <(find "$root" -type f -regextype posix-extended -regex "$regex" 2>/dev/null)
            done

            if [ "${#found[@]}" -eq 0 ]; then
              echo "No $label candidates found under existing roots." >&2
              return 1
            fi

            mapfile -t found < <(printf '%s\n' "${found[@]}" | sort -u)
            echo "- $label candidates:" >&2
            printf '  - %s\n' "${found[@]}" >&2

            if [ "${#found[@]}" -ne 1 ]; then
              echo "Expected exactly one $label artifact but found ${#found[@]}." >&2
              return 1
            fi

            printf '%s\n' "${found[0]}"
          }

          contains_one_of() {
            local search_root="$1"
            shift
            local names=("$@")
            local found=""
            for name in "${names[@]}"; do
              if found="$(find "$search_root" -type f -name "$name" -print -quit)" && [ -n "$found" ]; then
                printf '%s\n' "$found"
                return 0
              fi
            done
            return 1
          }

          appimage="$(find_bundle_artifact '.*/bundle/appimage/[^/]+\.AppImage$' 'AppImage')"
          deb_package="$(find_bundle_artifact '.*/bundle/deb/[^/]+\.deb$' 'deb')"

          appimage_extract_dir="$RUNNER_TEMP/appimage-inspect"
          rm -rf "$appimage_extract_dir"
          mkdir -p "$appimage_extract_dir"

          chmod +x "$appimage"
          (
            cd "$appimage_extract_dir"
            "$appimage" --appimage-extract >/dev/null
          )

          appimage_root="$appimage_extract_dir/squashfs-root"
          if [ ! -d "$appimage_root" ]; then
            echo "AppImage extraction failed; expected $appimage_root" >&2
            exit 1
          fi

          appimage_ffmpeg="$(contains_one_of "$appimage_root" "${ffmpeg_allowed_names[@]}" || true)"
          appimage_ffprobe="$(contains_one_of "$appimage_root" "${ffprobe_allowed_names[@]}" || true)"

          if [ -z "$appimage_ffmpeg" ] || [ -z "$appimage_ffprobe" ]; then
            echo "AppImage sidecar verification failed for $appimage" >&2
            echo "Allowed FFmpeg names: ${ffmpeg_allowed_names[*]}" >&2
            echo "Allowed FFprobe names: ${ffprobe_allowed_names[*]}" >&2
            find "$appimage_root" -type f \( -name '*ffmpeg*' -o -name '*ffprobe*' \) -print >&2 || true
            exit 1
          fi

          echo "AppImage sidecars found:"
          echo "- $appimage_ffmpeg"
          echo "- $appimage_ffprobe"

          deb_extract_dir="$RUNNER_TEMP/deb-inspect"
          rm -rf "$deb_extract_dir"
          mkdir -p "$deb_extract_dir"
          dpkg-deb -x "$deb_package" "$deb_extract_dir"

          deb_ffmpeg="$(contains_one_of "$deb_extract_dir" "${ffmpeg_allowed_names[@]}" || true)"
          deb_ffprobe="$(contains_one_of "$deb_extract_dir" "${ffprobe_allowed_names[@]}" || true)"

          if [ -z "$deb_ffmpeg" ] || [ -z "$deb_ffprobe" ]; then
            echo "deb sidecar verification failed for $deb_package" >&2
            echo "Allowed FFmpeg names: ${ffmpeg_allowed_names[*]}" >&2
            echo "Allowed FFprobe names: ${ffprobe_allowed_names[*]}" >&2
            find "$deb_extract_dir" -type f \( -name '*ffmpeg*' -o -name '*ffprobe*' \) -print >&2 || true
            exit 1
          fi

          echo "deb sidecars found:"
          echo "- $deb_ffmpeg"
          echo "- $deb_ffprobe"

  publish-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-and-upload
    runs-on: ubuntu-latest
    steps:
      - name: Publish validated release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "${{ github.ref_name }}" --repo "${{ github.repository }}"
          gh release edit "${{ github.ref_name }}" --draft=false --repo "${{ github.repository }}"
